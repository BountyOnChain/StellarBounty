# =============================================================================
# StellarBounty — Backup Verification
#
# Verifies backup restore readiness by:
#   1. Restoring the latest backup fixture
#   2. Restoring a 14-day-old backup fixture
#   3. Restoring a WAL-PITR-style -3h snapshot fixture
#   4. Publishing a restore diff when any scenario fails
# =============================================================================

name: Backup Verification

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/backup-db.sh'
      - 'scripts/restore-db.sh'
      - '.github/workflows/backup-verify.yml'

jobs:
  verify-backup:
    name: Verify Backup Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_bounty_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Generate restore fixture backups
        run: |
          set -euo pipefail
          mkdir -p backups artifacts

          create_fixture_db() {
            local db_name="$1"
            local include_latest="$2"
            local include_pitr="$3"
            local include_14d="$4"

            PGPASSWORD=postgres dropdb -h localhost -U postgres --if-exists "${db_name}" 2>/dev/null || true
            PGPASSWORD=postgres createdb -h localhost -U postgres "${db_name}"

            PGPASSWORD=postgres psql -h localhost -U postgres -d "${db_name}" <<SQL
            CREATE TABLE bounties (
              id SERIAL PRIMARY KEY,
              title VARCHAR(255) NOT NULL,
              description TEXT,
              amount NUMERIC,
              status VARCHAR(50) DEFAULT 'open',
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
            );
            CREATE TABLE nonces (
              id SERIAL PRIMARY KEY,
              nonce VARCHAR(255) NOT NULL,
              expires_at TIMESTAMPTZ NOT NULL,
              created_at TIMESTAMPTZ DEFAULT NOW()
            );
            CREATE TABLE submissions (
              id SERIAL PRIMARY KEY,
              bounty_id INTEGER REFERENCES bounties(id),
              submitter VARCHAR(255) NOT NULL,
              content TEXT,
              status VARCHAR(50) DEFAULT 'pending',
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW()
            );

            -- Present in all snapshots (>= 14 days old)
            INSERT INTO bounties (title, description, amount, created_at, updated_at)
            SELECT
              'Test Bounty 14D',
              'Data expected in 14-day restore verification',
              100,
              NOW() - INTERVAL '14 days',
              NOW() - INTERVAL '14 days'
            WHERE '${include_14d}' = '1';

            -- Present in latest + PITR (-3h) snapshots
            INSERT INTO bounties (title, description, amount, created_at, updated_at)
            SELECT
              'Test Bounty PITR_MINUS_3H',
              'Data expected in -3h PITR snapshot',
              200,
              NOW() - INTERVAL '3 hours',
              NOW() - INTERVAL '3 hours'
            WHERE '${include_pitr}' = '1';

            -- Present in latest snapshot only (newer than PITR target)
            INSERT INTO bounties (title, description, amount, created_at, updated_at)
            SELECT
              'Test Bounty Latest',
              'Data only expected in latest restore',
              300,
              NOW() - INTERVAL '15 minutes',
              NOW() - INTERVAL '15 minutes'
            WHERE '${include_latest}' = '1';

            INSERT INTO submissions (bounty_id, submitter, content, created_at, updated_at)
            SELECT id, 'GA-test-account-1', 'Submission for backup verification', created_at, created_at
            FROM bounties;
SQL
          }

          # Latest backup fixture: includes all records
          create_fixture_db "stellar_bounty_fixture_latest" "1" "1" "1"
          # 14-day-old backup fixture: includes only old baseline data
          create_fixture_db "stellar_bounty_fixture_14d" "0" "0" "1"
          # WAL-PITR -3h fixture: excludes the latest 15-minute data
          create_fixture_db "stellar_bounty_fixture_pitr3h" "0" "1" "1"

          pg_dump "postgresql://postgres:postgres@localhost:5432/stellar_bounty_fixture_latest" \
            --format=custom --verbose --clean --if-exists --no-owner --no-acl \
            --file="backups/latest.dump" 2>&1

          pg_dump "postgresql://postgres:postgres@localhost:5432/stellar_bounty_fixture_14d" \
            --format=custom --verbose --clean --if-exists --no-owner --no-acl \
            --file="backups/backup-14d.dump" 2>&1

          pg_dump "postgresql://postgres:postgres@localhost:5432/stellar_bounty_fixture_pitr3h" \
            --format=custom --verbose --clean --if-exists --no-owner --no-acl \
            --file="backups/backup-pitr-3h.dump" 2>&1

      - name: Run restore verification scenarios
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/restore-diff.txt

          run_restore_test() {
            local case_name="$1"
            local backup_file="$2"
            local restore_db="$3"
            local expected_count="$4"
            local expected_latest_title="$5"
            local expected_latest_cutoff="$6"
            local expected_no_latest="$7"

            echo "=== Running ${case_name} ==="
            PGPASSWORD=postgres dropdb -h localhost -U postgres --if-exists "${restore_db}" 2>/dev/null || true
            PGPASSWORD=postgres createdb -h localhost -U postgres "${restore_db}"

            set +e
            pg_restore \
              --dbname="postgresql://postgres:postgres@localhost:5432/${restore_db}" \
              --format=custom \
              --verbose \
              --clean \
              --if-exists \
              --no-owner \
              --no-acl \
              "${backup_file}" > "artifacts/${case_name}.restore.log" 2>&1
            local restore_exit="$?"
            set -e

            local actual_count actual_latest_title actual_latest_ts latest_row_count
            actual_count="$(PGPASSWORD=postgres psql -h localhost -U postgres -d "${restore_db}" -t -A -c "SELECT COUNT(*) FROM bounties;")"
            actual_latest_title="$(PGPASSWORD=postgres psql -h localhost -U postgres -d "${restore_db}" -t -A -c "SELECT title FROM bounties ORDER BY created_at DESC LIMIT 1;")"
            actual_latest_ts="$(PGPASSWORD=postgres psql -h localhost -U postgres -d "${restore_db}" -t -A -c "SELECT to_char(MAX(created_at), 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') FROM bounties;")"
            latest_row_count="$(PGPASSWORD=postgres psql -h localhost -U postgres -d "${restore_db}" -t -A -c "SELECT COUNT(*) FROM bounties WHERE title = 'Test Bounty Latest';")"

            printf "restore_exit=%s\nexpected_count=%s\nexpected_latest_title=%s\nexpected_latest_cutoff=%s\nexpected_no_latest=%s\n" \
              "${restore_exit}" "${expected_count}" "${expected_latest_title}" "${expected_latest_cutoff}" "${expected_no_latest}" > "artifacts/${case_name}.expected"

            printf "restore_exit=%s\nactual_count=%s\nactual_latest_title=%s\nactual_latest_ts=%s\nactual_latest_row_count=%s\n" \
              "${restore_exit}" "${actual_count}" "${actual_latest_title}" "${actual_latest_ts}" "${latest_row_count}" > "artifacts/${case_name}.actual"

            local case_failed=0
            if [ "${restore_exit}" -ne 0 ]; then
              case_failed=1
            fi
            if [ "${actual_count}" != "${expected_count}" ]; then
              case_failed=1
            fi
            if [ "${actual_latest_title}" != "${expected_latest_title}" ]; then
              case_failed=1
            fi
            if [ "${expected_no_latest}" = "yes" ] && [ "${latest_row_count}" != "0" ]; then
              case_failed=1
            fi
            if [ "${expected_latest_cutoff}" = "before_now_minus_3h" ]; then
              local newer_than_cutoff
              newer_than_cutoff="$(PGPASSWORD=postgres psql -h localhost -U postgres -d "${restore_db}" -t -A -c "SELECT COUNT(*) FROM bounties WHERE created_at > NOW() - INTERVAL '3 hours';")"
              if [ "${newer_than_cutoff}" != "0" ]; then
                case_failed=1
                echo "actual_newer_than_cutoff=${newer_than_cutoff}" >> "artifacts/${case_name}.actual"
              fi
            fi

            if [ "${case_failed}" -eq 1 ]; then
              echo "❌ ${case_name} failed"
              {
                echo "## ${case_name}"
                echo
                diff -u "artifacts/${case_name}.expected" "artifacts/${case_name}.actual" || true
                echo
                echo "--- restore log tail ---"
                tail -n 40 "artifacts/${case_name}.restore.log" || true
                echo
              } >> artifacts/restore-diff.txt
              return 1
            fi

            echo "✅ ${case_name} passed"
            return 0
          }

          failures=0
          run_restore_test "latest-backup" "backups/latest.dump" "stellar_bounty_restored_latest" "3" "Test Bounty Latest" "none" "no" || failures=$((failures + 1))
          run_restore_test "backup-14-days-old" "backups/backup-14d.dump" "stellar_bounty_restored_14d" "1" "Test Bounty 14D" "none" "yes" || failures=$((failures + 1))
          run_restore_test "wal-pitr-minus-3h" "backups/backup-pitr-3h.dump" "stellar_bounty_restored_pitr3h" "2" "Test Bounty PITR_MINUS_3H" "before_now_minus_3h" "yes" || failures=$((failures + 1))

          if [ "${failures}" -gt 0 ]; then
            echo "${failures} restore scenario(s) failed." >&2
            exit 1
          fi

          echo "All restore scenarios passed."

      - name: Verify backup files are present and non-trivial
        run: |
          set -euo pipefail
          for backup in backups/latest.dump backups/backup-14d.dump backups/backup-pitr-3h.dump; do
            echo "Inspecting ${backup}"
            file "${backup}"
            size_bytes="$(stat -c%s "${backup}")"
            if [ "${size_bytes}" -le 5000 ]; then
              echo "Backup ${backup} is too small: ${size_bytes} bytes" >&2
              exit 1
            fi
          done

      - name: Save restore diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-verify-restore-diff
          path: artifacts/restore-diff.txt

      - name: Clean up test databases
        if: always()
        run: |
          set +e
          for db in \
            stellar_bounty_fixture_latest \
            stellar_bounty_fixture_14d \
            stellar_bounty_fixture_pitr3h \
            stellar_bounty_restored_latest \
            stellar_bounty_restored_14d \
            stellar_bounty_restored_pitr3h; do
            PGPASSWORD=postgres dropdb -h localhost -U postgres --if-exists "${db}" 2>/dev/null || true
          done

      - name: Notify on failure with high-priority issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const diffPath = 'artifacts/restore-diff.txt';
            const restoreDiff = fs.existsSync(diffPath)
              ? fs.readFileSync(diffPath, 'utf8')
              : 'No restore diff file was generated.';

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description
                  });
                } else {
                  throw error;
                }
              }
            }

            await ensureLabel('area:infra', '0e8a16', 'Infrastructure related work');
            await ensureLabel('priority:high', 'b60205', 'High priority work');

            const maxDiffLength = 60000;
            const truncatedDiff = restoreDiff.length > maxDiffLength
              ? `${restoreDiff.slice(0, maxDiffLength)}\n\n...diff truncated...`
              : restoreDiff;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backup restore verification failed (${new Date().toISOString().slice(0, 10)})`,
              labels: ['area:infra', 'priority:high'],
              body: [
                'Backup restore verification failed for one or more scenarios.',
                '',
                '### Restore scenarios',
                '- Latest backup restore',
                '- 14-day-old backup restore',
                '- WAL-PITR restore at -3h snapshot',
                '',
                `- Workflow run: ${runUrl}`,
                `- Trigger: ${context.eventName}`,
                `- Branch/ref: ${context.ref}`,
                '',
                '### Restore diff',
                '```diff',
                truncatedDiff,
                '```'
              ].join('\n')
            });