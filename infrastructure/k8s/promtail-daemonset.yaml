# ============================================================================
# infrastructure/k8s/promtail-daemonset.yaml
#
# Ships every node's container stdio logs (already JSON thanks to our
# JsonLoggerService) into the in-cluster Loki service. Replaces the
# compose Promtail container when running in production-grade k8s.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: stellar-bounty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: stellar-bounty
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: stellar-bounty
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: stellar-bounty
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: stellar-bounty
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args:
            - -config.file=/etc/promtail/config.yaml
          ports:
            - name: http
              containerPort: 9080
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: run
              mountPath: /var/run
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: run
          hostPath:
            path: /var/run
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: tmp
          emptyDir: {}
---
# Promtail config as a ConfigMap (Renders the pipeline from the in-cluster
# Loki service URL; this is the k8s twin of
# infrastructure/loki/promtail-config.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: stellar-bounty
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      log_level: info
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_part_of']
            regex: stellar-bounty
            action: keep
          - source_labels: ['__meta_kubernetes_pod_name']
            target_label: pod
          - source_labels: ['__meta_kubernetes_namespace']
            target_label: namespace
        pipeline_stages:
          - docker: {}
          - match:
              selector: '{namespace="stellar-bounty"}'
              stages:
                - json:
                    expressions:
                      level: level
                      service: service
                      env: env
                      requestId: requestId
                - labels:
                    level:
                    service:
                    env:
