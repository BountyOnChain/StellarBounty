# ============================================================================
# infrastructure/k8s/hpa.yaml — HorizonalPodAutoscaler for the backend
#
# The backend is the only stateful-ish workload worth scaling: contract
# RPC + JWT verification are CPU-bound during traffic spikes.
# `minReplicas: 2` ensures no single-pod outage during a rolling restart
# so the API stays available to clients mid-rollout.
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: stellar-bounty
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: stellar-bounty
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
