global:
  resolve_timeout: 5m
  smtp_smarthost: localhost:1025
  smtp_from: alerts@stellar-bounty.local

route:
  receiver: ops-email
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: ops-email
      repeat_interval: 1h

receivers:
  - name: ops-email
    email_configs:
      - to: ops@stellar-bounty.local
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - service
