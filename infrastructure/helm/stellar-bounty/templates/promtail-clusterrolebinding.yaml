{{- if .Values.promtail.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-bounty.fullname" . }}-promtail
  labels:
    {{- include "stellar-bounty.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-bounty.fullname" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-bounty.fullname" . }}-promtail
    namespace: {{ .Release.Namespace }}
{{- end }}
