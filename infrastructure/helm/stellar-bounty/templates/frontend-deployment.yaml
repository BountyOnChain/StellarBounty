{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stellar-bounty.fullname" . }}-frontend
  labels:
    {{- include "stellar-bounty.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: {{ .Values.frontend.updateStrategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.frontend.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.frontend.updateStrategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "stellar-bounty.componentSelectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stellar-bounty.componentLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stellar-bounty.fullname" . }}-backend-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_STELLAR_NETWORK
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stellar-bounty.fullname" . }}-backend-config
                  key: NEXT_PUBLIC_STELLAR_NETWORK
            - name: PORT
              value: "3000"
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "stellar-bounty.componentSelectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
{{- end }}
