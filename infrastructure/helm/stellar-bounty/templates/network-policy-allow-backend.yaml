{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stellar-bounty.fullname" . }}-allow-backend-egress
  labels:
    {{- include "stellar-bounty.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    {{- include "stellar-bounty.componentSelectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "stellar-bounty.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 12 }}
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
