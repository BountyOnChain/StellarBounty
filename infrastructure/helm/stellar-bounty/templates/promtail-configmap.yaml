{{- if .Values.promtail.enabled -}}
{{- /*
The Promtail scrape selector needs the chart's deployment namespace baked
in. We rely on Helm evaluating text/template BEFORE YAML parsing so
{{ .Release.Namespace }} inside the `|` literal block does render.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-bounty.fullname" . }}-promtail-config
  labels:
    {{- include "stellar-bounty.componentLabels" (dict "ctx" . "component" "promtail") | nindent 4 }}
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      log_level: info
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: {{ .Values.promtail.lokiUrl | quote }}
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_part_of']
            regex: stellar-bounty
            action: keep
          - source_labels: ['__meta_kubernetes_pod_name']
            target_label: pod
          - source_labels: ['__meta_kubernetes_namespace']
            target_label: namespace
        pipeline_stages:
          - docker: {}
          - match:
              selector: '{namespace="{{ .Release.Namespace }}"}'
              stages:
                - regex:
                    expression: '"level"\s*:\s*"(?P<level>[^"]+)"'
                - regex:
                    expression: '"service"\s*:\s*"(?P<service>[^"]+)"'
                - regex:
                    expression: '"env"\s*:\s*"(?P<env>[^"]+)"'
                - labels:
                    level:
                    service:
                    env:
{{- end }}
